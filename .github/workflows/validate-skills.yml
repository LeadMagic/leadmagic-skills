name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Skills & plugin checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep shellcheck

      - name: Shellcheck scripts
        run: shellcheck -S warning scripts/*.sh install.sh

      - name: Validate skills, manifests, commands, agents
        run: |
          chmod +x scripts/validate.sh scripts/build.sh scripts/credit-guard-bulk.sh
          ./scripts/validate.sh

      - name: Validate Claude Code plugin manifest
        run: npx -y @anthropic-ai/claude-code@latest plugin validate .

      - name: Test bulk result identity guard
        run: python3 -B -m unittest discover -s tests -v

      - name: Package skills (smoke)
        run: ./scripts/build.sh

      - name: Upload skill zips
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leadmagic-skills
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package Skills
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build
        run: chmod +x scripts/build.sh && ./scripts/build.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leadmagic-skills-main
          path: dist/*.zip
          retention-days: 30
