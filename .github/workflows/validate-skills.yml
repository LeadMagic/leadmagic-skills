name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Skills & plugin checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep shellcheck jq

      - name: Shellcheck scripts
        run: shellcheck -S warning scripts/*.sh install.sh

      - name: Validate skills, manifests, commands, agents
        run: |
          chmod +x scripts/validate.sh scripts/build.sh scripts/approval-policy.sh
          ./scripts/validate.sh

      - name: Install into a fresh directory
        run: |
          ./install.sh "$RUNNER_TEMP/skills-install"
          for skill in skills/*/; do
            name=$(basename "$skill")
            test -f "$RUNNER_TEMP/skills-install/$name/SKILL.md" || { echo "missing $name/SKILL.md"; exit 1; }
          done
          test ! -e "$RUNNER_TEMP/skills-install/SKILL.md"

      - name: Validate Claude Code plugin manifest
        run: |
          npx -y @anthropic-ai/claude-code@2.1.296 plugin validate .
          npx -y @anthropic-ai/claude-code@2.1.296 plugin validate .claude-plugin/plugin.json

      - name: Check public files
        run: python3 -B scripts/check-public-files.py

      - name: Test approval policy and bulk result identity guards
        run: python3 -B -m unittest discover -s tests -v

      - name: Package skills (smoke)
        run: ./scripts/build.sh

      - name: Upload skill zips
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leadmagic-skills
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package Skills
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build
        run: chmod +x scripts/build.sh && ./scripts/build.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leadmagic-skills-main
          path: dist/*.zip
          retention-days: 30
